Dashboard:
  Type: AWS::CloudWatch::Dashboard
  Condition: CreateProdResources
  Properties:
    DashboardName:
      Fn::Sub: ${Prefix}-${ProjectId}-${StageId}-Dashboard
    DashboardBody:
      Fn::Sub: |-
        {
          "widgets": [
            {
              "type": "text",
              "x": 0,
              "y": 0,
              "width": 24,
              "height": 2,
              "properties": {
                "markdown": "# ${Prefix}-${ProjectId}-${StageId}-Dashboard\n\nEvent-driven cache invalidation for S3-backed CloudFront distributions."
              }
            },
            {
              "type": "alarm",
              "x": 0,
              "y": 2,
              "width": 24,
              "height": 3,
              "properties": {
                "title": "Alarms",
                "alarms": [
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${IngestorFunctionErrorsAlarm}",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${ProcessorFunctionErrorsAlarm}",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${ProcessorFunctionDurationAlarm}",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${DLQMessageAlarm}"
                ]
              }
            },
            {
              "type": "text",
              "x": 0,
              "y": 5,
              "width": 24,
              "height": 2,
              "properties": {
                "markdown": "## Lambda Function - Ingestor\n\nThe ingestor receives the S3 events and provides filtering prior to submitting to the queue. It is also in charge of scheduling the Processor."
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 7,
              "width": 6,
              "height": 6,
              "properties": {
                "metrics": [
                  [
                    "AWS/Lambda",
                    "Invocations",
                    "FunctionName",
                    "${IngestorFunction}",
                    {
                      "id": "m1",
                      "color": "#1f77b4",
                      "region": "${AWS::Region}"
                    }
                  ],
                  [
                    "AWS/Lambda",
                    "Errors",
                    "FunctionName",
                    "${IngestorFunction}",
                    {
                      "id": "m2",
                      "color": "#d62728",
                      "region": "${AWS::Region}"
                    }
                  ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Ingestor Invocations & Errors",
                "period": 300,
                "stat": "Sum"
              }
            },
            {
              "type": "metric",
              "x": 6,
              "y": 7,
              "width": 6,
              "height": 6,
              "properties": {
                "metrics": [
                  [
                    "AWS/Lambda",
                    "Duration",
                    "FunctionName",
                    "${IngestorFunction}",
                    {
                      "id": "m1",
                      "color": "#ff7f0e",
                      "region": "${AWS::Region}"
                    }
                  ],
                  [
                    "...",
                    {
                      "id": "m2",
                      "stat": "Maximum",
                      "color": "#d62728",
                      "region": "${AWS::Region}"
                    }
                  ],
                  [
                    "...",
                    {
                      "id": "m3",
                      "stat": "Minimum",
                      "color": "#2ca02c",
                      "region": "${AWS::Region}"
                    }
                  ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Ingestor Duration",
                "period": 300,
                "stat": "Average"
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 7,
              "width": 6,
              "height": 6,
              "properties": {
                "metrics": [
                  [
                    "AWS/Lambda",
                    "ConcurrentExecutions",
                    "FunctionName",
                    "${IngestorFunction}",
                    {
                      "region": "${AWS::Region}"
                    }
                  ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Ingestor Concurrent Executions",
                "period": 300,
                "stat": "Average"
              }
            },
            {
              "type": "metric",
              "x": 18,
              "y": 7,
              "width": 6,
              "height": 6,
              "properties": {
                "metrics": [
                  [
                    "AWS/Lambda",
                    "Invocations",
                    "FunctionName",
                    "${IngestorFunction}",
                    {
                      "id": "m1",
                      "color": "#1f77b4",
                      "region": "${AWS::Region}"
                    }
                  ],
                  [
                    "AWS/Lambda",
                    "Errors",
                    "FunctionName",
                    "${IngestorFunction}",
                    {
                      "id": "m2",
                      "color": "#d62728",
                      "region": "${AWS::Region}"
                    }
                  ]
                ],
                "view": "singleValue",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Ingestor Invocations Summary",
                "period": 3600,
                "stat": "Sum",
                "setPeriodToTimeRange": true,
                "sparkline": false,
                "trend": false
              }
            },
            {
              "type": "log",
              "x": 0,
              "y": 13,
              "width": 24,
              "height": 3,
              "properties": {
                "query": "SOURCE '/aws/lambda/${IngestorFunction}' | filter @type = \"REPORT\"\n| stats max(@memorySize / 1024 / 1024) as provisonedMemoryMB,\n    min(@maxMemoryUsed / 1024 / 1024) as smallestMemoryRequestMB,\n    avg(@maxMemoryUsed / 1024 / 1024) as avgMemoryUsedMB,\n    max(@maxMemoryUsed / 1024 / 1024) as maxMemoryUsedMB,\n    provisonedMemoryMB - maxMemoryUsedMB as overProvisionedMB",
                "region": "${AWS::Region}",
                "title": "Ingestor Memory",
                "view": "table"
              }
            },
            {
              "type": "log",
              "x": 0,
              "y": 16,
              "width": 24,
              "height": 3,
              "properties": {
                "query": "SOURCE '/aws/lambda/${IngestorFunction}' | filter @type=\"REPORT\"\n| fields (@duration<50) as R50,\n  (@duration>=50 and @duration<100) as R50_100,\n  (@duration>=100 and @duration<250) as R100_250,\n  (@duration>=250 and @duration<500) as R250_500,\n  (@duration>=500 and @duration<750) as R500_750,\n  (@duration>=750 and @duration<1000) as R750_1000,\n  (@duration>=1000 and @duration<=2000) as R1000_2000,\n  (@duration>=2000 and @duration<=3000) as R2000_3000,\n  (@duration>=3000 and @duration<=4000) as R3000_4000,\n  (@duration>=4000 and @duration<=5000) as R4000_5000,\n  (@duration>=5000 and @duration<=6000) as R5000_6000,\n  (@duration>=6000 and @duration<=7000) as R6000_7000,\n  (@duration>=7000 and @duration<=8000) as R7000_8000,\n  (@duration>=8000 and @duration<=9000) as R8000_9000,\n  (@duration>=9000 and @duration<=10000) as R9000_10000,\n  (@duration>10000) as R10000\n| stats min(@duration) as minDur,\n  avg(@duration) as avgDur,\n  max(@duration) as maxDur,\n  sum(R50) as D50ms,\n  sum(R50_100) as D50_100ms,\n  sum(R100_250) as D100_250ms,\n  sum(R250_500) as D250_500ms,\n  sum(R500_750) as D500_750ms,\n  sum(R750_1000) as D750_1000ms,\n  sum(R1000_2000) as D1_2s,\n  sum(R2000_3000) as D2_3s,\n  sum(R3000_4000) as D3_4s,\n  sum(R4000_5000) as D4_5s,\n  sum(R5000_6000) as D5_6s,\n  sum(R6000_7000) as D6_7s,\n  sum(R7000_8000) as D7_8s,\n  sum(R8000_9000) as D8_9s,\n  sum(R9000_10000) as D9_10s,\n  sum(R10000) as D10s",
                "region": "${AWS::Region}",
                "title": "Ingestor Durations",
                "view": "table"
              }
            },
            {
              "type": "log",
              "x": 0,
              "y": 19,
              "width": 24,
              "height": 4,
              "properties": {
                "query": "SOURCE '/aws/lambda/${IngestorFunction}' | fields @timestamp as ts, @requestId, @message, @logStream as logStream\n| sort ts desc\n| limit 500\n| PARSE @message \"[*] *\" as loggingType, loggingMessage\n| FILTER (loggingType = \"ERROR\" or loggingType = \"WARN\" or @message like \"Task timed out\")\n| DISPLAY ts, logStream, loggingType, loggingMessage",
                "region": "${AWS::Region}",
                "stacked": false,
                "title": "Error and Warning Log",
                "view": "table"
              }
            },
            {
              "type": "text",
              "x": 0,
              "y": 23,
              "width": 24,
              "height": 2,
              "properties": {
                "markdown": "## SQS Queue\n\nThe SQS Queue receives events from the Ingestor and holds them for batch processing."
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 25,
              "width": 6,
              "height": 6,
              "properties": {
                "metrics": [
                  [
                    "AWS/SQS",
                    "ApproximateNumberOfMessages",
                    "QueueName",
                    "${EventQueue}",
                    {
                      "id": "m1",
                      "color": "#1f77b4",
                      "region": "${AWS::Region}"
                    }
                  ],
                  [
                    "AWS/SQS",
                    "ApproximateNumberOfMessagesVisible",
                    "QueueName",
                    "${EventQueue}",
                    {
                      "id": "m2",
                      "color": "#ff7f0e",
                      "region": "${AWS::Region}"
                    }
                  ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Event Queue Message Count",
                "period": 300,
                "stat": "Average"
              }
            },
            {
              "type": "metric",
              "x": 6,
              "y": 25,
              "width": 6,
              "height": 6,
              "properties": {
                "metrics": [
                  [
                    "AWS/SQS",
                    "ApproximateAgeOfOldestMessage",
                    "QueueName",
                    "${EventQueue}",
                    {
                      "id": "m1",
                      "color": "#d62728",
                      "region": "${AWS::Region}"
                    }
                  ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Event Queue Age of Oldest Message",
                "period": 300,
                "stat": "Maximum",
                "yAxis": {
                  "left": {
                    "min": 0
                  }
                }
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 25,
              "width": 6,
              "height": 6,
              "properties": {
                "metrics": [
                  [
                    "AWS/SQS",
                    "ApproximateNumberOfMessages",
                    "QueueName",
                    "${EventQueueDLQ}",
                    {
                      "id": "m1",
                      "color": "#d62728",
                      "region": "${AWS::Region}"
                    }
                  ],
                  [
                    "AWS/SQS",
                    "ApproximateNumberOfMessagesVisible",
                    "QueueName",
                    "${EventQueueDLQ}",
                    {
                      "id": "m2",
                      "color": "#ff7f0e",
                      "region": "${AWS::Region}"
                    }
                  ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Dead Letter Queue Messages",
                "period": 300,
                "stat": "Average",
                "annotations": {
                  "horizontal": [
                    {
                      "label": "Alert Threshold",
                      "value": 1
                    }
                  ]
                }
              }
            },
            {
              "type": "metric",
              "x": 18,
              "y": 25,
              "width": 6,
              "height": 6,
              "properties": {
                "metrics": [
                  [
                    "AWS/SQS",
                    "NumberOfMessagesSent",
                    "QueueName",
                    "${EventQueue}",
                    {
                      "id": "m1",
                      "color": "#2ca02c",
                      "region": "${AWS::Region}"
                    }
                  ],
                  [
                    "AWS/SQS",
                    "NumberOfMessagesReceived",
                    "QueueName",
                    "${EventQueue}",
                    {
                      "id": "m2",
                      "color": "#1f77b4",
                      "region": "${AWS::Region}"
                    }
                  ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "SQS Message Send/Receive Rates",
                "period": 300,
                "stat": "Sum"
              }
            },
            {
              "type": "text",
              "x": 0,
              "y": 31,
              "width": 24,
              "height": 2,
              "properties": {
                "markdown": "## Lambda Function - Processor\n\nThe Processor reads the SQS queue, consolidates sibling events, and submits the invalidation request to the associated CloudFront distribution."
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 33,
              "width": 6,
              "height": 6,
              "properties": {
                "metrics": [
                  [
                    "AWS/Lambda",
                    "Invocations",
                    "FunctionName",
                    "${ProcessorFunction}",
                    {
                      "id": "m2",
                      "color": "#1f77b4",
                      "region": "${AWS::Region}"
                    }
                  ],
                  [
                    "AWS/Lambda",
                    "Errors",
                    "FunctionName",
                    "${ProcessorFunction}",
                    {
                      "id": "m4",
                      "color": "#d62728",
                      "region": "${AWS::Region}"
                    }
                  ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Invocations",
                "period": 300,
                "stat": "Sum"
              }
            },
            {
              "type": "metric",
              "x": 6,
              "y": 33,
              "width": 6,
              "height": 6,
              "properties": {
                "metrics": [
                  [
                    "AWS/Lambda",
                    "ConcurrentExecutions",
                    "FunctionName",
                    "${ProcessorFunction}",
                    {
                      "region": "${AWS::Region}"
                    }
                  ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Concurrent Executions",
                "period": 300,
                "stat": "Average"
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 33,
              "width": 6,
              "height": 6,
              "properties": {
                "metrics": [
                  [
                    "AWS/Lambda",
                    "Duration",
                    "FunctionName",
                    "${ProcessorFunction}",
                    {
                      "id": "m1",
                      "color": "#ff7f0e",
                      "region": "${AWS::Region}"
                    }
                  ],
                  [
                    "...",
                    {
                      "id": "m2",
                      "stat": "Maximum",
                      "color": "#d62728",
                      "region": "${AWS::Region}"
                    }
                  ],
                  [
                    "...",
                    {
                      "id": "m3",
                      "stat": "Minimum",
                      "color": "#2ca02c",
                      "region": "${AWS::Region}"
                    }
                  ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Avg Duration",
                "period": 300,
                "stat": "Average"
              }
            },
            {
              "type": "metric",
              "x": 18,
              "y": 33,
              "width": 6,
              "height": 6,
              "properties": {
                "metrics": [
                  [
                    "AWS/Lambda",
                    "Invocations",
                    "FunctionName",
                    "${ProcessorFunction}",
                    {
                      "id": "m2",
                      "color": "#1f77b4",
                      "region": "${AWS::Region}"
                    }
                  ],
                  [
                    "AWS/Lambda",
                    "Errors",
                    "FunctionName",
                    "${ProcessorFunction}",
                    {
                      "id": "m4",
                      "color": "#d62728",
                      "region": "${AWS::Region}"
                    }
                  ]
                ],
                "view": "singleValue",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Lambda Invocations",
                "period": 3600,
                "stat": "Sum",
                "setPeriodToTimeRange": true,
                "sparkline": false,
                "trend": false
              }
            },


            {
              "type": "log",
              "x": 0,
              "y": 39,
              "width": 24,
              "height": 3,
              "properties": {
                "query": "SOURCE '/aws/lambda/${ProcessorFunction}' | filter @type = \"REPORT\"\n| stats max(@memorySize / 1024 / 1024) as provisonedMemoryMB,\n    min(@maxMemoryUsed / 1024 / 1024) as smallestMemoryRequestMB,\n    avg(@maxMemoryUsed / 1024 / 1024) as avgMemoryUsedMB,\n    max(@maxMemoryUsed / 1024 / 1024) as maxMemoryUsedMB,\n    provisonedMemoryMB - maxMemoryUsedMB as overProvisionedMB",
                "region": "${AWS::Region}",
                "title": "Memory",
                "view": "table"
              }
            },
            {
              "type": "log",
              "x": 0,
              "y": 42,
              "width": 24,
              "height": 3,
              "properties": {
                "query": "SOURCE '/aws/lambda/${ProcessorFunction}' | filter @type=\"REPORT\"\n| fields (@duration<50) as R50,\n  (@duration>=50 and @duration<100) as R50_100,\n  (@duration>=100 and @duration<250) as R100_250,\n  (@duration>=250 and @duration<500) as R250_500,\n  (@duration>=500 and @duration<750) as R500_750,\n  (@duration>=750 and @duration<1000) as R750_1000,\n  (@duration>=1000 and @duration<=2000) as R1000_2000,\n  (@duration>=2000 and @duration<=3000) as R2000_3000,\n  (@duration>=3000 and @duration<=4000) as R3000_4000,\n  (@duration>=4000 and @duration<=5000) as R4000_5000,\n  (@duration>=5000 and @duration<=6000) as R5000_6000,\n  (@duration>=6000 and @duration<=7000) as R6000_7000,\n  (@duration>=7000 and @duration<=8000) as R7000_8000,\n  (@duration>=8000 and @duration<=9000) as R8000_9000,\n  (@duration>=9000 and @duration<=10000) as R9000_10000,\n  (@duration>10000) as R10000\n| stats min(@duration) as minDur,\n  avg(@duration) as avgDur,\n  max(@duration) as maxDur,\n  sum(R50) as D50ms,\n  sum(R50_100) as D50_100ms,\n  sum(R100_250) as D100_250ms,\n  sum(R250_500) as D250_500ms,\n  sum(R500_750) as D500_750ms,\n  sum(R750_1000) as D750_1000ms,\n  sum(R1000_2000) as D1_2s,\n  sum(R2000_3000) as D2_3s,\n  sum(R3000_4000) as D3_4s,\n  sum(R4000_5000) as D4_5s,\n  sum(R5000_6000) as D5_6s,\n  sum(R6000_7000) as D6_7s,\n  sum(R7000_8000) as D7_8s,\n  sum(R8000_9000) as D8_9s,\n  sum(R9000_10000) as D9_10s,\n  sum(R10000) as D10s",
                "region": "${AWS::Region}",
                "title": "Durations",
                "view": "table"
              }
            },
            {
              "type": "log",
              "x": 0,
              "y": 45,
              "width": 24,
              "height": 6,
              "properties": {
                "query": "SOURCE '/aws/lambda/${ProcessorFunction}' | fields @timestamp as ts, @requestId, @message, @logStream as logStream\n| sort ts desc\n| limit 500\n| PARSE @message \"[*] *\" as loggingType, loggingMessage\n| FILTER (loggingType = \"ERROR\" or loggingType = \"WARN\" or @message like \"Task timed out\")\n| DISPLAY ts, logStream, loggingType, loggingMessage",
                "region": "${AWS::Region}",
                "stacked": false,
                "title": "Error and Warning Log",
                "view": "table"
              }
            },
            {
              "height": 2,
              "width": 24,
              "y": 51,
              "x": 0,
              "type": "text",
              "properties": {
                "markdown": "## Cold Starts\n\n\nA cold start is when a Lambda function is loaded for execution. After execution, the Lambda function will reside in memory for up to 45 minutes waiting for additional executions.\n\n\nCold starts will occur for each new concurrent execution and after a Lambda function has been dormant for a period of time."
              }
            },
            {
              "height": 6,
              "width": 24,
              "y": 53,
              "x": 0,
              "type": "log",
              "properties": {
                "query": "SOURCE '/aws/lambda/${ProcessorFunction}' | filter @type=\"REPORT\"\n| fields @initDuration\n| stats min(@duration) as minDur,\n  avg(@initDuration) as avgDur,\n  max(@initDuration) as maxDur,\n  count(@initDuration) as num",
                "region": "${AWS::Region}",
                "stacked": false,
                "title": "Cold Starts",
                "view": "table"
              }
            }
          ]
        }

Dashboard:
  Type: AWS::CloudWatch::Dashboard
  Condition: CreateProdResources
  Properties:
    DashboardName:
      Fn::Sub: ${Prefix}-${ProjectId}-${StageId}-Dashboard
    DashboardBody:
      Fn::Sub: "{\n  \"widgets\": [\n    {\n      \"type\": \"text\",\n      \"x\"\
        : 0,\n      \"y\": 0,\n      \"width\": 24,\n      \"height\": 2,\n      \"\
        properties\": {\n        \"markdown\": \"# ${Prefix}-${ProjectId}-${StageId}-Dashboard\"\
        \n      }\n    },\n    {\n      \"type\": \"text\",\n      \"x\": 0,\n   \
        \   \"y\": 2,\n      \"width\": 24,\n      \"height\": 2,\n      \"properties\"\
        : {\n        \"markdown\": \"## Lambda Functions - Processor\"\n      }\n\
        \    },\n    {\n      \"type\": \"metric\",\n      \"x\": 0,\n      \"y\"\
        : 4,\n      \"width\": 6,\n      \"height\": 7,\n      \"properties\": {\n\
        \        \"metrics\": [\n          [\n            \"AWS/Lambda\",\n      \
        \      \"Invocations\",\n            \"FunctionName\",\n            \"${ProcessorFunction}\"\
        ,\n            {\n              \"id\": \"m2\",\n              \"color\":\
        \ \"#1f77b4\",\n              \"region\": \"${AWS::Region}\"\n           \
        \ }\n          ],\n          [\n            \"AWS/Lambda\",\n            \"\
        Errors\",\n            \"FunctionName\",\n            \"${ProcessorFunction}\"\
        ,\n            {\n              \"id\": \"m4\",\n              \"color\":\
        \ \"#d62728\",\n              \"region\": \"${AWS::Region}\"\n           \
        \ }\n          ]\n        ],\n        \"view\": \"timeSeries\",\n        \"\
        stacked\": false,\n        \"region\": \"${AWS::Region}\",\n        \"title\"\
        : \"Invocations\",\n        \"period\": 300,\n        \"stat\": \"Sum\"\n\
        \      }\n    },\n    {\n      \"type\": \"metric\",\n      \"x\": 6,\n  \
        \    \"y\": 4,\n      \"width\": 6,\n      \"height\": 7,\n      \"properties\"\
        : {\n        \"metrics\": [\n          [\n            \"AWS/Lambda\",\n  \
        \          \"ConcurrentExecutions\",\n            \"FunctionName\",\n    \
        \        \"${ProcessorFunction}\",\n            {\n              \"region\"\
        : \"${AWS::Region}\"\n            }\n          ]\n        ],\n        \"view\"\
        : \"timeSeries\",\n        \"stacked\": false,\n        \"region\": \"${AWS::Region}\"\
        ,\n        \"title\": \"Concurrent Executions\",\n        \"period\": 300,\n\
        \        \"stat\": \"Average\"\n      }\n    },\n    {\n      \"type\": \"\
        metric\",\n      \"x\": 12,\n      \"y\": 4,\n      \"width\": 6,\n      \"\
        height\": 7,\n      \"properties\": {\n        \"metrics\": [\n          [\n\
        \            \"AWS/Lambda\",\n            \"Duration\",\n            \"FunctionName\"\
        ,\n            \"${ProcessorFunction}\",\n            {\n              \"\
        id\": \"m1\",\n              \"color\": \"#ff7f0e\",\n              \"region\"\
        : \"${AWS::Region}\"\n            }\n          ],\n          [\n         \
        \   \"...\",\n            {\n              \"id\": \"m2\",\n             \
        \ \"stat\": \"Maximum\",\n              \"color\": \"#d62728\",\n        \
        \      \"region\": \"${AWS::Region}\"\n            }\n          ],\n     \
        \     [\n            \"...\",\n            {\n              \"id\": \"m3\"\
        ,\n              \"stat\": \"Minimum\",\n              \"color\": \"#2ca02c\"\
        ,\n              \"region\": \"${AWS::Region}\"\n            }\n         \
        \ ]\n        ],\n        \"view\": \"timeSeries\",\n        \"stacked\": false,\n\
        \        \"region\": \"${AWS::Region}\",\n        \"title\": \"Avg Duration\"\
        ,\n        \"period\": 300,\n        \"stat\": \"Average\"\n      }\n    },\n\
        \    {\n      \"type\": \"metric\",\n      \"x\": 18,\n      \"y\": 4,\n \
        \     \"width\": 6,\n      \"height\": 5,\n      \"properties\": {\n     \
        \   \"metrics\": [\n          [\n            \"AWS/Lambda\",\n           \
        \ \"Invocations\",\n            \"FunctionName\",\n            \"${ProcessorFunction}\"\
        ,\n            {\n              \"id\": \"m2\",\n              \"color\":\
        \ \"#1f77b4\",\n              \"region\": \"${AWS::Region}\"\n           \
        \ }\n          ],\n          [\n            \"AWS/Lambda\",\n            \"\
        Errors\",\n            \"FunctionName\",\n            \"${ProcessorFunction}\"\
        ,\n            {\n              \"id\": \"m4\",\n              \"color\":\
        \ \"#d62728\",\n              \"region\": \"${AWS::Region}\"\n           \
        \ }\n          ]\n        ],\n        \"view\": \"singleValue\",\n       \
        \ \"stacked\": false,\n        \"region\": \"${AWS::Region}\",\n        \"\
        title\": \"Lambda Invocations\",\n        \"period\": 3600,\n        \"stat\"\
        : \"Sum\",\n        \"setPeriodToTimeRange\": true,\n        \"sparkline\"\
        : false,\n        \"trend\": false\n      }\n    },\n    {\n      \"type\"\
        : \"metric\",\n      \"x\": 0,\n      \"y\": 11,\n      \"width\": 6,\n  \
        \    \"height\": 7,\n      \"properties\": {\n        \"metrics\": [\n   \
        \       [\n            \"AWS/Lambda\",\n            \"Errors\",\n        \
        \    \"FunctionName\",\n            \"${ProcessorFunction}\",\n          \
        \  {\n              \"id\": \"m4\",\n              \"visible\": true,\n  \
        \            \"stat\": \"Sum\",\n              \"color\": \"#d62728\",\n \
        \             \"region\": \"${AWS::Region}\"\n            }\n          ]\n\
        \        ],\n        \"view\": \"timeSeries\",\n        \"stacked\": false,\n\
        \        \"region\": \"${AWS::Region}\",\n        \"title\": \"Lambda Errors\"\
        ,\n        \"period\": 300,\n        \"stat\": \"Average\"\n      }\n    },\n\
        \    {\n      \"type\": \"alarm\",\n      \"x\": 18,\n      \"y\": 14,\n \
        \     \"width\": 6,\n      \"height\": 4,\n      \"properties\": {\n     \
        \   \"title\": \"Alarms\",\n        \"alarms\": [\n          \"arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${IngestorFunctionErrorsAlarm}\"\
        ,\n          \"arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${ProcessorFunctionErrorsAlarm}\"\
        ,\n          \"arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${ProcessorFunctionDurationAlarm}\"\
        ,\n          \"arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${DLQMessageAlarm}\"\
        \n        ]\n      }\n    },\n    {\n      \"type\": \"log\",\n      \"x\"\
        : 0,\n      \"y\": 18,\n      \"width\": 24,\n      \"height\": 3,\n     \
        \ \"properties\": {\n        \"query\": \"SOURCE '/aws/lambda/${ProcessorFunction}'\
        \ | filter @type = \\\"REPORT\\\"\\n| stats max(@memorySize / 1024 / 1024)\
        \ as provisonedMemoryMB,\\n    min(@maxMemoryUsed / 1024 / 1024) as smallestMemoryRequestMB,\\\
        n    avg(@maxMemoryUsed / 1024 / 1024) as avgMemoryUsedMB,\\n    max(@maxMemoryUsed\
        \ / 1024 / 1024) as maxMemoryUsedMB,\\n    provisonedMemoryMB - maxMemoryUsedMB\
        \ as overProvisionedMB\",\n        \"region\": \"${AWS::Region}\",\n     \
        \   \"title\": \"Memory\",\n        \"view\": \"table\"\n      }\n    },\n\
        \    {\n      \"type\": \"log\",\n      \"x\": 0,\n      \"y\": 21,\n    \
        \  \"width\": 24,\n      \"height\": 3,\n      \"properties\": {\n       \
        \ \"query\": \"SOURCE '/aws/lambda/${ProcessorFunction}' | filter @type=\\\
        \"REPORT\\\"\\n| fields (@duration<50) as R50,\\n  (@duration>=50 and @duration<100)\
        \ as R50_100,\\n  (@duration>=100 and @duration<250) as R100_250,\\n  (@duration>=250\
        \ and @duration<500) as R250_500,\\n  (@duration>=500 and @duration<750) as\
        \ R500_750,\\n  (@duration>=750 and @duration<1000) as R750_1000,\\n  (@duration>=1000\
        \ and @duration<=2000) as R1000_2000,\\n  (@duration>=2000 and @duration<=3000)\
        \ as R2000_3000,\\n  (@duration>=3000 and @duration<=4000) as R3000_4000,\\\
        n  (@duration>=4000 and @duration<=5000) as R4000_5000,\\n  (@duration>=5000\
        \ and @duration<=6000) as R5000_6000,\\n  (@duration>=6000 and @duration<=7000)\
        \ as R6000_7000,\\n  (@duration>=7000 and @duration<=8000) as R7000_8000,\\\
        n  (@duration>=8000 and @duration<=9000) as R8000_9000,\\n  (@duration>=9000\
        \ and @duration<=10000) as R9000_10000,\\n  (@duration>10000) as R10000\\\
        n| stats min(@duration) as minDur,\\n  avg(@duration) as avgDur,\\n  max(@duration)\
        \ as maxDur,\\n  sum(R50) as D50ms,\\n  sum(R50_100) as D50_100ms,\\n  sum(R100_250)\
        \ as D100_250ms,\\n  sum(R250_500) as D250_500ms,\\n  sum(R500_750) as D500_750ms,\\\
        n  sum(R750_1000) as D750_1000ms,\\n  sum(R1000_2000) as D1_2s,\\n  sum(R2000_3000)\
        \ as D2_3s,\\n  sum(R3000_4000) as D3_4s,\\n  sum(R4000_5000) as D4_5s,\\\
        n  sum(R5000_6000) as D5_6s,\\n  sum(R6000_7000) as D6_7s,\\n  sum(R7000_8000)\
        \ as D7_8s,\\n  sum(R8000_9000) as D8_9s,\\n  sum(R9000_10000) as D9_10s,\\\
        n  sum(R10000) as D10s\",\n        \"region\": \"${AWS::Region}\",\n     \
        \   \"title\": \"Durations\",\n        \"view\": \"table\"\n      }\n    },\n\
        \    {\n      \"type\": \"log\",\n      \"x\": 0,\n      \"y\": 24,\n    \
        \  \"width\": 24,\n      \"height\": 6,\n      \"properties\": {\n       \
        \ \"query\": \"SOURCE '/aws/lambda/${ProcessorFunction}' | fields @timestamp\
        \ as ts, @message\\n| sort ts desc\\n| limit 500\\n| PARSE @message \\\"[*]\
        \ * | * | * | * | * | * | * | * | * | * | * | * | *\\\" as loggingType, statusCode,\
        \ bytes, contentType, execTime, clientIP, userAgent, origin, referrer, resource,\
        \ queryKeys, pathLog, queryLog, key\\n| FILTER loggingType = \\\"RESPONSE\\\
        \"\\n| DISPLAY ts, statusCode, bytes, execTime, clientIP, userAgent, origin,\
        \ referrer, resource, queryKeys, pathLog, queryLog, key\",\n        \"region\"\
        : \"${AWS::Region}\",\n        \"stacked\": false,\n        \"view\": \"table\"\
        ,\n        \"title\": \"Response Log\"\n      }\n    },\n    {\n      \"type\"\
        : \"log\",\n      \"x\": 0,\n      \"y\": 30,\n      \"width\": 24,\n    \
        \  \"height\": 6,\n      \"properties\": {\n        \"query\": \"SOURCE '/aws/lambda/${ProcessorFunction}'\
        \ | fields @timestamp as ts, @requestId, @message, @logStream as logStream\\\
        n| sort ts desc\\n| limit 500\\n| PARSE @message \\\"[*] *\\\" as loggingType,\
        \ loggingMessage\\n| FILTER (loggingType = \\\"ERROR\\\" or loggingType =\
        \ \\\"WARN\\\" or @message like \\\"Task timed out\\\")\\n| DISPLAY ts, logStream,\
        \ loggingType, loggingMessage\",\n        \"region\": \"${AWS::Region}\",\n\
        \        \"stacked\": false,\n        \"title\": \"Error and Warning Log\"\
        ,\n        \"view\": \"table\"\n      }\n    },\n    {\n      \"height\":\
        \ 2,\n      \"width\": 24,\n      \"y\": 59,\n      \"x\": 0,\n      \"type\"\
        : \"text\",\n      \"properties\": {\n        \"markdown\": \"## Cold Starts\\\
        n\\n\\nA cold start is when a Lambda function is loaded for execution. After\
        \ execution, the Lambda function will reside in memory for up to 45 minutes\
        \ waiting for additional executions.\\n\\n\\nCold starts will occur for each\
        \ new concurrent execution and after a Lambda function has been dormant for\
        \ a period of time.\"\n      }\n    },\n    {\n      \"height\": 3,\n    \
        \  \"width\": 24,\n      \"y\": 62,\n      \"x\": 0,\n      \"type\": \"log\"\
        ,\n      \"properties\": {\n        \"query\": \"SOURCE '/aws/lambda/${ProcessorFunction}'\
        \ | filter @type=\\\"REPORT\\\"\\n| fields @initDuration\\n| stats min(@duration)\
        \ as minDur,\\n  avg(@initDuration) as avgDur,\\n  max(@initDuration) as maxDur,\\\
        n  count(@initDuration) as num\",\n        \"region\": \"${AWS::Region}\"\
        ,\n        \"stacked\": false,\n        \"title\": \"Cold Starts\",\n    \
        \    \"view\": \"table\"\n      }\n    }\n  ]\n}"

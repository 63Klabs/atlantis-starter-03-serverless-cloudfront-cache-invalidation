version: 0.2

# Many BUILD ENVIRONMENT VARIABLES are specified in the template-pipeline.yml template.
# Search for 'EnvironmentVariables' under AWS::CodeBuild::Project in the template.
# 
# You can also run the command `printenv`

phases:
  install:
    runtime-versions:
      nodejs: latest
    commands:
      
      - ls -l -a

      # Build Environment information for debugging purposes
      - python3 --version
      - node --version
      - aws --version

      # Configure pip cache directory
      - mkdir -p /root/.cache/pip
      - pip config set global.cache-dir /root/.cache/pip

      # Build Environment: Install Python dependencies for Build Scripts if build-scripts/requirements.txt exists
      - |
        if [ -f "build-scripts/requirements.txt" ]; then
          echo "Installing Python dependencies for build scripts"
          pip install -r build-scripts/requirements.txt
        else
          echo "No build-scripts/requirements.txt found, skipping pip install"
        fi

  pre_build:
    commands:
      
      # Layer Dependencies: Install dependencies for Lambda layer
      - |
        if [ -f "application-infrastructure/layers/common/requirements.txt" ]; then
          echo "Installing Python dependencies for common layer"
          pip install -r application-infrastructure/layers/common/requirements.txt -t application-infrastructure/layers/common/python/
        else
          echo "No layers/common/requirements.txt found, skipping layer dependencies"
        fi
      
      # Function Dependencies: Install dependencies for ingestor function
      - |
        if [ -f "application-infrastructure/functions/ingestor/requirements.txt" ]; then
          echo "Installing Python dependencies for ingestor function"
          pip install -r application-infrastructure/functions/ingestor/requirements.txt -t application-infrastructure/functions/ingestor/
        else
          echo "No functions/ingestor/requirements.txt found, skipping ingestor dependencies"
        fi
      
      # Function Dependencies: Install dependencies for processor function
      - |
        if [ -f "application-infrastructure/functions/processor/requirements.txt" ]; then
          echo "Installing Python dependencies for processor function"
          pip install -r application-infrastructure/functions/processor/requirements.txt -t application-infrastructure/functions/processor/
        else
          echo "No functions/processor/requirements.txt found, skipping processor dependencies"
        fi
      
      # Test Environment: Install CI/CD test dependencies to prevent crashes
      - |
        if [ -f "application-infrastructure/tests/requirements.txt" ]; then
          echo "Installing CI/CD Python test dependencies (excludes larger packages)"
          pip install -r application-infrastructure/tests/requirements.txt
        else
          echo "No test requirements found, installing minimal safe dependencies"
          pip install pytest==8.3.3 hypothesis==6.112.1 pytest-mock==3.14.0
        fi
            
  build:
    commands:

      - cd application-infrastructure
      
      # IMPORTANT: Using Non-Local Dev test execution to prevent CI/CD crashes
      # Integration tests are disabled because they make real AWS API calls
      # Resource-heavy property tests are limited to prevent system overload

      # Run SAFE tests using dedicated script from build-scripts directory
      # This script prevents CI/CD crashes by running only unit tests and safe property tests
      - ./build-scripts/run_tests_safely.sh

      # There is sometimes a bug that causes the alias to not be updated correctly (see comment in template.yml for AppFunction.Properties.AutoPublishCodeSha256)
      - python3 ./build-scripts/update_template_timestamp.py template.yml

      # Replace placeholders in the template-configuration.json file
      - python3 ./build-scripts/update_template_configuration.py template-configuration.json

      # Use CloudFormation to package the application infrastructure and code that was placed in the S3 Artifacts Bucket (usually something like `cf-artifacts-<region>-<account-id>` or `cf-templates-randomchars-<region>`).
      - aws cloudformation package --template template.yml --s3-bucket $S3_ARTIFACTS_BUCKET --output-template template-export.yml

      # list files in the artifacts
      - ls -l -a

artifacts:
  files:
    - 'application-infrastructure/**/*'

# add cache
cache:
  paths:
    - '/root/.cache/pip/**/*'
# Atlantis for AWS SAM Deployments
# Starter 01 - Basic API Gateway and Lambda using Python
# Author: Chad Kluck - 63klabs.net
# Version: v2.0.3/2025-11-25

# Documentation, Issues/Feature Requests, Latest Updates, and Security Reports on GitHub:
# https://github.com/63Klabs/atlantis-starter-00-basic-apigw-lambda-nodejs

# Creates a basic web service using API Gateway and Lambda using Python

# USE WITH:
# - atlantis/v2/pipeline/template.yml

AWSTemplateFormatVersion: "2010-09-09"
Transform:  AWS::Serverless-2016-10-31
Description: "Multi-Bucket CloudFront Invalidation Service - Event-driven cache invalidation for S3-backed CloudFront distributions"

# =============================================================================
# META DATA
# -----------------------------------------------------------------------------
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-cloudformation-interface.html
# 

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - 
        Label:
          default: "Application Resource Naming"
        Parameters:
          - Prefix
          - ProjectId
          - StageId
          - S3BucketNameOrgPrefix
          - RolePath
          - PermissionsBoundaryArn
      -
        Label:
          default: "Deployment Environment Information"
        Parameters:
          - DeployEnvironment
          - FunctionGradualDeploymentType
          - DeployRole
      -
        Label:
          default: "External Resources and Alarm Notifications"
        Parameters:
          - ParameterStoreHierarchy
          - AlarmNotificationEmail
      -
        Label:
          default: "Lambda Function Settings"
        Parameters:
          - IngestorTimeoutInSeconds
          - IngestorMemoryInMB
          - ProcessorTimeoutInSeconds
          - ProcessorMemoryInMB
          - FunctionArchitecture
      -
        Label:
          default: "Application Parameters"
        Parameters:
          - LogRetentionInDaysForPROD
          - LogRetentionInDaysForDEVTEST
          - AggregationWindowSeconds
          - MaxPathsPerInvalidation

# =============================================================================
# PARAMETERS
# -----------------------------------------------------------------------------
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/parameters-section-structure.html
#

Parameters:

  # ---------------------------------------------------------------------------
  # Application Resource Naming

  Prefix:
    Type: String
    Description: "Prefix pre-pended to all resources. This can be thought of as a Name Space used to identify ownership/access for teams, departments, etc. For example, resources named ws-* could belong to the web service team and could have IAM permissions to allow access to other ws-* resources. The Prefix must have a corresponding CloudFormation Service Role. Short, descriptive 2-6 character values work best. Due to resource naming length restrictions, length of Prefix + Project ID should not exceed 28 characters. Resources are named <Prefix>-<ProjectId>-<StageId>-<ResourceId>"
    Default: "acme" 
    AllowedPattern: "^[a-z][a-z0-9-]{0,6}[a-z0-9]$"
    MinLength: 2
    MaxLength: 8
    ConstraintDescription: "2 to 8 characters. Lower case alphanumeric and dashes. Must start with a letter and end with a letter or number. Length of Prefix + Project ID should not exceed 28 characters."

  ProjectId:
    Type: String
    Description: "This is the Project or Application Identifier. If you receive 'S3 bucket name too long' errors during stack creation, then you must shorten the Project ID or use an S3 Org Prefix. Due to resource naming length restrictions, length of Prefix + Project ID should not exceed 28 characters. Resources are named <Prefix>-<ProjectId>-<StageId>-<ResourceId>"
    AllowedPattern: "^[a-z][a-z0-9-]{0,24}[a-z0-9]$"
    MinLength: 2
    MaxLength: 26
    ConstraintDescription: "Minimum of 2 characters (suggested maximum of 20). Lower case alphanumeric and dashes. Must start with a letter and end with a letter or number. Length of Prefix + Project ID should not exceed 28 characters."

  StageId:
    Type: String
    Description: "This is an alias for the branch. It does not need to match CodeCommitBranch or DeployEnvironment. Due to resource naming restrictions you can use this to provide shorter names without special characters that are allowed in branch names. For example if you have a 'test/feature-98' branch, you could use 'tf98' as the StageId. Resources are named <Prefix>-<ProjectId>-<StageId>-<ResourceId>"
    AllowedPattern: "^[a-z][a-z0-9-]{0,6}[a-z0-9]$"
    MinLength: 2
    MaxLength: 8
    ConstraintDescription: "2 to 8 characters. Lower case alphanumeric and dashes. Must start with a letter and end with a letter or number."

  S3BucketNameOrgPrefix:
    Type: String
    Description: "By default, to enforce uniqueness, buckets include account and region in the bucket name. However, due to character limits, you can specify your own S3 prefix (like an org code). This will be used in addition to the Prefix entered above. Note that this length is shared with the recommended length of 20 characters for Resource Identifiers. So if you have a 10 character S3BucketNameOrgPrefix, you are limited to 10 characters for your bucket name identifier in your templates. Buckets are named <Prefix>-<Region>-<AccountId>-<ProjectId>-<StageId>-<ResourceId> or <S3OrgPrefix>-<Prefix>-<ProjectId>-<StageId>-<ResourceId>"
    Default: ""
    AllowedPattern: "^[a-z0-9][a-z0-9-]{0,18}[a-z0-9]$|^$"
    ConstraintDescription: "May be empty or 2 to 20 characters (8 or less recommended). Lower case alphanumeric and dashes. Must start and end with a letter or number."

  RolePath:
    Type: String
    Description: "Path to use for IAM Roles and Policies. You may wish to separate out your applications from users, or create seperate paths per prefix or application. Specific paths may required by permission boundaries. Ex: /ws-hello-world-test/ or /app_role/"
    Default: "/"
    AllowedPattern: "^\\/([a-zA-Z0-9-_]+[\\/])+$|^\\/$"
    ConstraintDescription: "May only contain alphanumeric characters, forward slashes, underscores, and dashes. Must begin and end with a slash."

  PermissionsBoundaryArn:
    Type: String
    Description: "Permissions Boundary is a policy attached to a role to further restrict the permissions of the role. Your organization may or may not require boundaries. If left empty, no permissions boundary will be used."
    Default: ""
    AllowedPattern: "^$|^arn:aws:iam::\\d{12}:policy\\/[\\w+=,.@\\-\\/]*[\\w+=,.@\\-]+$"
    ConstraintDescription: "Must be empty or a valid IAM Policy ARN in the format: arn:aws:iam::{account_id}:policy/{policy_name}"

  # ---------------------------------------------------------------------------
  # Deployment Environment Identification

  DeployEnvironment:
    Type: String
    Description: "What deploy/testing environment will this run under? An environment can contain multiple stages (for example 'test' and 't98' would be in 'TEST' environment, and 'beta' and 'prod' stages would deploy to 'PROD'). Utilize this environment variable to determine your tests, app logging levels, and conditionals in the template. For example, PROD will use gradual deployment while DEV and TEST is AllAtOnce. Other resources, such as dashboards and alarms  (which cost money) could be created in PROD and not DEV or TEST. Suggested use: DEV for local SAM deployment, TEST for test/QA deployments, PROD for stage, beta, and main/prod deployments."
    Default: "PROD"
    AllowedValues: ["DEV", "TEST", "PROD"]
    ConstraintDescription: "Must specify DEV, TEST, or PROD."

  FunctionGradualDeploymentType:
    Type: String
    Description: "For production environments, what method do you want to use to gradually deploy before rolling back in case of errors. Note that when 'DeployEnvironment' is TEST or DEV, gradual deploy will not be enabled and will be same as All At Once"
    Default: "Linear10PercentEvery3Minutes"
    AllowedValues:
      - "Canary10Percent5Minutes" # Canary = First 10%, then after x minutes, full 90% (full deploy after x minutes)
      - "Canary10Percent10Minutes"
      - "Canary10Percent15Minutes"
      - "Canary10Percent30Minutes"
      - "Linear10PercentEvery1Minute" # Linear = Total of 10 deploys every x minutes: 10%, wait x minutes, another 10%, wait, 10%.... (full deploy after 10 * x minutes)
      - "Linear10PercentEvery2Minutes"
      - "Linear10PercentEvery3Minutes"
      - "Linear10PercentEvery10Minutes"
      - "AllAtOnce" # All at once. Recommended only for TEST and DEV environments.

  DeployRole:
    Type: String
    Description: "IAM role to allow AWS CodeDeploy to manage deployment of AWS Lambda functions"

  # ---------------------------------------------------------------------------
  # External Resources and Alarm Notifications

  ParameterStoreHierarchy:
    Type: String
    Description: "Parameters specific to the application may be organized within a hierarchy based on your organizational or operations structure. For example, /Finance/ops/ for this value would then generate /Finance/ops/<DeployEnvironment>/<Prefix>-<ProjectId>-<StageId>/<parameterName>. Must either be a single '/' or begin and end with a '/'."
    Default: "/"
    AllowedPattern: "^\\/([a-zA-Z0-9_.\\-]*[\\/])+$|^\\/$"
    ConstraintDescription: "Must only contain alpha-numeric, dashes, underscores, or slashes. Must be a single slash or begin and end with a slash. (/Finance/, /Finance/ops/, or /)"

  AlarmNotificationEmail:
    Type: String
    Description: "Email address to send notifications to when alarms are triggered. Be sure to check the inbox as you will need to confirm the subscription."
    AllowedPattern: "^[\\w\\-\\.]+@([\\w\\-]+\\.)+[\\w\\-]{2,4}$"
    ConstraintDescription: "A valid email address"

  # ---------------------------------------------------------------------------
  # Lambda Function Settings

  IngestorTimeoutInSeconds:
    Type: Number
    Description: "Timeout for the Ingestor Lambda function that receives S3 events and queues them for processing"
    Default: 10
    MinValue: 3
    MaxValue: 30

  IngestorMemoryInMB:
    Type: Number
    Description: "Memory allocation for the Ingestor Lambda function"
    Default: 256
    MinValue: 128
    MaxValue: 10240

  ProcessorTimeoutInSeconds:
    Type: Number
    Description: "Timeout for the Processor Lambda function that processes queued events and submits CloudFront invalidations"
    Default: 300
    MinValue: 60
    MaxValue: 900

  ProcessorMemoryInMB:
    Type: Number
    Description: "Memory allocation for the Processor Lambda function"
    Default: 512
    MinValue: 128
    MaxValue: 10240

  FunctionArchitecture:
    Type: String
    Description: "The instruction set architecture for the Lambda functions. Lambda functions support x86_64 and arm64 architectures. arm64 has better processing than default x86_64 - but the layers and binaries you use must support it."
    Default: "arm64"
    AllowedValues: ["x86_64", "arm64"]

  # ---------------------------------------------------------------------------
  # Application Parameters

  LogRetentionInDaysForPROD:
    Type: Number
    Description: "How long should CloudWatch logs be kept in a PRODUCTION environment?"
    Default: 90
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]

  LogRetentionInDaysForDEVTEST:
    Type: Number
    Description: "How long should CloudWatch logs be kept in a DEV or TEST environment?"
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]

  AggregationWindowSeconds:
    Type: Number
    Description: "Duration of the aggregation window in seconds (time to collect events before processing)"
    Default: 300
    MinValue: 60
    MaxValue: 900

  MaxPathsPerInvalidation:
    Type: Number
    Description: "Maximum number of paths per CloudFront invalidation request (CloudFront limit is 3000)"
    Default: 1000
    MinValue: 1
    MaxValue: 3000

# =============================================================================
# CONDITIONS
# -----------------------------------------------------------------------------
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/intrinsic-function-reference-conditions.html
#

Conditions:
  IsProduction: !Equals [!Ref DeployEnvironment, "PROD"]
  # IsNotProduction: !Not [!Equals [!Ref DeployEnvironment, "PROD"]]
  IsNotDevelopment: !Not [!Equals [!Ref DeployEnvironment, "DEV"]]
  # IsTest: !Equals [!Ref DeployEnvironment, "TEST"]
  # IsDevelopment: !Equals [!Ref DeployEnvironment, "DEV"]
  CreateProdResources: !Equals [!Ref DeployEnvironment, "PROD"]
  # CreateTestResources: !Equals [!Ref DeployEnvironment, "TEST"]
  # CreateDevResources: !Equals [!Ref DeployEnvironment, "DEV"]
  UseS3BucketNameOrgPrefix: !Not [!Equals [!Ref S3BucketNameOrgPrefix, ""]]
  HasPermissionsBoundaryArn: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]
  CreateAlarms: !Equals [!Ref DeployEnvironment, "PROD"]
  # IsArmArch: !Equals [!Ref FunctionArchitecture, "arm64"]

# =============================================================================
# GLOBALS
# -----------------------------------------------------------------------------
# https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-specification-template-anatomy-globals.html
#

Globals:

  Function:
    PropagateTags: True
    Tracing: !If [ IsNotDevelopment, "Active", !Ref 'AWS::NoValue'] # X-Ray

  # StateMachine:
  #   PropagateTags: True

# =============================================================================
# RESOURCES
# -----------------------------------------------------------------------------
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/resources-section-structure.html  
#

Resources:

  # ===========================================================================
  # SQS QUEUE RESOURCES
  # ===========================================================================

  # -- SQS Dead Letter Queue --
  EventQueueDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${Prefix}-${ProjectId}-${StageId}-EventQueueDLQ'
      MessageRetentionPeriod: 1209600  # 14 days
      Tags:
        - Key: AllowInvalidationEvents
          Value: "true"

  # -- SQS Event Queue --
  EventQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${Prefix}-${ProjectId}-${StageId}-EventQueue'
      VisibilityTimeout: 300  # 5 minutes (matches Processor timeout)
      MessageRetentionPeriod: 345600  # 4 days
      ReceiveMessageWaitTimeSeconds: 20  # Long polling
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EventQueueDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: AllowInvalidationEvents
          Value: "true"

  # ===========================================================================
  # DYNAMODB TABLE RESOURCES
  # ===========================================================================

  # -- DynamoDB Window Tracking Table --
  WindowTrackingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Prefix}-${ProjectId}-${StageId}-WindowTracking'
      BillingMode: PAY_PER_REQUEST  # On-demand pricing for unpredictable traffic
      AttributeDefinitions:
        - AttributeName: windowId
          AttributeType: S
      KeySchema:
        - AttributeName: windowId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: windowEndTime
        Enabled: true
      Tags:
        - Key: AllowInvalidationEvents
          Value: "true"

  # ===========================================================================
  # LAMBDA FUNCTION RESOURCES - INGESTOR
  # ===========================================================================

  # -- Ingestor Lambda Function --
  IngestorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Prefix}-${ProjectId}-${StageId}-Ingestor'
      Description: "S3 Event Ingestor - Filters and queues S3 events for CloudFront invalidation"
      Role: !GetAtt IngestorExecutionRole.Arn
      PropagateTags: True

      VersionDescription: "Ingestor Code"
      AutoPublishCodeSha256: "20251209T0000" # Hash This To Overcome AliasLive Update Errors - Undocumented AWS bug workaround
      AutoPublishAlias: live
      DeploymentPreference:
        Enabled: !If [ IsProduction, True,  False] # Gradual deployment only if in production so DEV and TEST aren't hindered
        Type: !If [ IsProduction, !Ref FunctionGradualDeploymentType, "AllAtOnce"]
        Role: !Ref DeployRole
        Alarms:
          Fn::If:
            - CreateAlarms
            - - !Ref IngestorFunctionErrorsAlarm
            - - !Ref 'AWS::NoValue'

      CodeUri: src/
      Handler: ingestor.handler.handler
      Runtime: python3.14 # https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtimes.html
      Architectures:
        - !Ref FunctionArchitecture # arm64 has better processing than default x86_64 - but layers and binaries must support
      Timeout: !Ref IngestorTimeoutInSeconds
      MemorySize: !Ref IngestorMemoryInMB

      Environment:
        Variables:
          DEPLOY_ENVIRONMENT: !Ref DeployEnvironment
          LOG_LEVEL: !If [ IsProduction, "INFO",  "DEBUG"]
          LAMBDA_TIMEOUT_IN_SEC: !Ref IngestorTimeoutInSeconds
          AWS_LAMBDA_LOG_LEVEL: !If [ IsProduction, "INFO", "DEBUG"]
          AWS_LAMBDA_LOG_FORMAT: 'json'
          
          # Organizational naming components
          PREFIX: !Ref Prefix
          PROJECT_ID: !Ref ProjectId
          STAGE_ID: !Ref StageId
          
          # Ingestor-specific environment variables
          QUEUE_URL: !Ref EventQueue
          TRACKING_TABLE: !Ref WindowTrackingTable
          PROCESSOR_FUNCTION_ARN: !GetAtt ProcessorFunction.Arn
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerExecutionRole.Arn
          AGGREGATION_WINDOW_SECONDS: !Ref AggregationWindowSeconds
          
      Tags:
        AllowInvalidationEvents: "true"

  # -- Ingestor Lambda Execution Role --
  IngestorExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-${ProjectId}-${StageId}-IngestorExecRole"
      Description: "IAM Role for Ingestor Lambda - SQS SendMessage, DynamoDB PutItem/Query, EventBridge Scheduler CreateSchedule"
      Path: !Ref RolePath
      PermissionsBoundary: !If [HasPermissionsBoundaryArn, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue' ]
      AssumeRolePolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service: [lambda.amazonaws.com]
          Action: sts:AssumeRole

      Policies:
        - PolicyName: !Sub "${Prefix}-${ProjectId}-${StageId}-IngestorPolicy"
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: IngestorSQSSendMessage
                Effect: Allow
                Action:
                  - 'sqs:SendMessage'
                Resource: !GetAtt EventQueue.Arn

              - Sid: IngestorDynamoDBWindowTracking
                Effect: Allow
                Action:
                  - 'dynamodb:GetItem'
                  - 'dynamodb:PutItem'
                  - 'dynamodb:Query'
                  - 'dynamodb:UpdateItem'
                Resource: !GetAtt WindowTrackingTable.Arn

              - Sid: IngestorEventBridgeScheduler
                Effect: Allow
                Action:
                  - 'scheduler:CreateSchedule'
                  - 'scheduler:DeleteSchedule'
                Resource: !Sub 'arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/${Prefix}-${ProjectId}-${StageId}-*'

              - Sid: IngestorPassRoleToScheduler
                Effect: Allow
                Action:
                  - 'iam:PassRole'
                Resource: !GetAtt SchedulerExecutionRole.Arn
                Condition:
                  StringEquals:
                    'iam:PassedToService': 'scheduler.amazonaws.com'

              - Sid: IngestorWriteLogs
                Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: !GetAtt IngestorLogGroup.Arn

              - Sid: IngestorXRayTracing
                Effect: Allow
                Action:
                  - 'xray:PutTraceSegments'
                  - 'xray:PutTelemetryRecords'
                Resource: '*'

  # -- Lambda permissions allowing S3 Events to Execute Ingestor --
  #    For gradual deployments to work properly, triggering resources need permission to invoke both:
  #    1. $LATEST version (new code during deployment)
  #    2. :live alias (stable version during traffic shifting)
  #    Without both permissions, gradual deployments (in production) will fail with permission errors

  # Permission to invoke the $LATEST version of the Ingestor Lambda function
  # This is used in all environments and during gradual deployments for new code
  # SourceArn pattern handles both standard naming and optional S3BucketNameOrgPrefix
  IngestorLambdaPermission:
    Type: "AWS::Lambda::Permission"
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref IngestorFunction  # References $LATEST by default
      Principal: s3.amazonaws.com
      SourceArn: !Sub 
        - 'arn:aws:s3:::${OrgPrefix}${Prefix}*'
        - OrgPrefix: !If [UseS3BucketNameOrgPrefix, !Sub "${S3BucketNameOrgPrefix}-", ""]

  # Permission to invoke the :live alias of the Ingestor Lambda function
  # Only created in production where gradual deployments are enabled
  # During gradual deployment, traffic shifts from :live alias to $LATEST version
  # SourceArn pattern handles both standard naming and optional S3BucketNameOrgPrefix
  IngestorLambdaPermissionLive:
    Type: "AWS::Lambda::Permission"
    Condition: IsProduction  # Only needed in production for gradual deployments
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Sub "${IngestorFunction.Alias}"  # References the :live alias
      Principal: s3.amazonaws.com
      SourceArn: !Sub 
        - 'arn:aws:s3:::${OrgPrefix}${Prefix}*'
        - OrgPrefix: !If [UseS3BucketNameOrgPrefix, !Sub "${S3BucketNameOrgPrefix}-", ""]

  # -- Ingestor Lambda Log Group --
  IngestorLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties: 
        LogGroupName: !Sub '/aws/lambda/${Prefix}-${ProjectId}-${StageId}-Ingestor'
        RetentionInDays: !If [ IsProduction, !Ref LogRetentionInDaysForPROD,  !Ref LogRetentionInDaysForDEVTEST]

  # -- Ingestor Lambda Function Error Alarm --
  IngestorFunctionErrorsAlarm:
    Type: "AWS::CloudWatch::Alarm"
    Condition: CreateAlarms
    Properties:
      AlarmDescription: Ingestor Lambda Function Error > 1
      MetricName: Errors
      Statistic: Sum
      ComparisonOperator: GreaterThanThreshold
      Threshold: 1
      Period: 900  # 15 minutes
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref IngestorFunction
      AlarmActions:
        - Ref: AlarmNotificationTopic

  # ===========================================================================
  # LAMBDA FUNCTION RESOURCES - PROCESSOR
  # ===========================================================================

  # -- Processor Lambda Function --
  ProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Prefix}-${ProjectId}-${StageId}-Processor'
      Description: "Event Processor - Processes queued events and submits CloudFront invalidations"
      Role: !GetAtt ProcessorExecutionRole.Arn
      PropagateTags: True

      VersionDescription: "Processor Code"
      AutoPublishCodeSha256: "20251209T0001"
      AutoPublishAlias: live
      DeploymentPreference:
        Enabled: !If [ IsProduction, True,  False]
        Type: !If [ IsProduction, !Ref FunctionGradualDeploymentType, "AllAtOnce"]
        Role: !Ref DeployRole
        Alarms:
          Fn::If:
            - CreateAlarms
            - - !Ref ProcessorFunctionErrorsAlarm
              - !Ref ProcessorFunctionDurationAlarm
            - - !Ref 'AWS::NoValue'

      CodeUri: src/
      Handler: processor.handler.handler
      Runtime: python3.14
      Architectures:
        - !Ref FunctionArchitecture
      Timeout: !Ref ProcessorTimeoutInSeconds
      MemorySize: !Ref ProcessorMemoryInMB
      ReservedConcurrentExecutions: 1  # Prevent duplicate processing

      Environment:
        Variables:
          DEPLOY_ENVIRONMENT: !Ref DeployEnvironment
          LOG_LEVEL: !If [ IsProduction, "INFO",  "DEBUG"]
          LAMBDA_TIMEOUT_IN_SEC: !Ref ProcessorTimeoutInSeconds
          AWS_LAMBDA_LOG_LEVEL: !If [ IsProduction, "INFO", "DEBUG"]
          AWS_LAMBDA_LOG_FORMAT: 'json'
          
          # Organizational naming components
          PREFIX: !Ref Prefix
          PROJECT_ID: !Ref ProjectId
          STAGE_ID: !Ref StageId
          
          # Processor-specific environment variables
          QUEUE_URL: !Ref EventQueue
          TRACKING_TABLE: !Ref WindowTrackingTable
          MAX_BATCH_SIZE: 10
          MAX_PATHS_PER_INVALIDATION: !Ref MaxPathsPerInvalidation
          
      Tags:
        AllowInvalidationEvents: "true"

  # -- Processor Lambda Execution Role --
  ProcessorExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-${ProjectId}-${StageId}-ProcessorExecRole"
      Description: "IAM Role for Processor Lambda - SQS ReceiveMessage/DeleteMessage, S3 GetBucketTagging, CloudFront operations, DynamoDB UpdateItem"
      Path: !Ref RolePath
      PermissionsBoundary: !If [HasPermissionsBoundaryArn, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue' ]
      AssumeRolePolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service: [lambda.amazonaws.com]
          Action: sts:AssumeRole

      Policies:
        - PolicyName: !Sub "${Prefix}-${ProjectId}-${StageId}-ProcessorPolicy"
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ProcessorSQSReceiveDelete
                Effect: Allow
                Action:
                  - 'sqs:ReceiveMessage'
                  - 'sqs:DeleteMessage'
                  - 'sqs:GetQueueAttributes'
                Resource: !GetAtt EventQueue.Arn

              - Sid: ProcessorS3GetBucketTagging
                Effect: Allow
                Action:
                  - 's3:GetBucketTagging'
                Resource: !Sub 
                  - 'arn:aws:s3:::${OrgPrefix}${Prefix}*'
                  - OrgPrefix: !If [UseS3BucketNameOrgPrefix, !Sub "${S3BucketNameOrgPrefix}-", ""]
                Condition:
                  StringEquals:
                    'aws:ResourceTag/AllowInvalidationEvents': 'true'

              - Sid: ProcessorCloudFrontListGet
                Effect: Allow
                Action:
                  - 'cloudfront:GetDistribution'
                  - 'cloudfront:ListDistributions'
                  - 'cloudfront:ListTagsForResource'
                Resource: '*'

              - Sid: ProcessorCloudFrontCreateInvalidation
                Effect: Allow
                Action:
                  - 'cloudfront:CreateInvalidation'
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/*'
                Condition:
                  StringEquals:
                    'aws:ResourceTag/AllowInvalidationEvents': 'true'

              - Sid: ProcessorDynamoDBUpdateItem
                Effect: Allow
                Action:
                  - 'dynamodb:UpdateItem'
                  - 'dynamodb:Query'
                Resource: !GetAtt WindowTrackingTable.Arn

              - Sid: ProcessorWriteLogs
                Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: !GetAtt ProcessorLogGroup.Arn

              - Sid: ProcessorXRayTracing
                Effect: Allow
                Action:
                  - 'xray:PutTraceSegments'
                  - 'xray:PutTelemetryRecords'
                Resource: '*'

  # -- Processor Lambda Log Group --
  ProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties: 
        LogGroupName: !Sub '/aws/lambda/${Prefix}-${ProjectId}-${StageId}-Processor'
        RetentionInDays: !If [ IsProduction, !Ref LogRetentionInDaysForPROD,  !Ref LogRetentionInDaysForDEVTEST]

  # -- Processor Lambda Function Error Alarm --
  ProcessorFunctionErrorsAlarm:
    Type: "AWS::CloudWatch::Alarm"
    Condition: CreateAlarms
    Properties:
      AlarmDescription: Processor Lambda Function Error > 1
      MetricName: Errors
      Statistic: Sum
      ComparisonOperator: GreaterThanThreshold
      Threshold: 1
      Period: 900  # 15 minutes
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref ProcessorFunction
      AlarmActions:
        - Ref: AlarmNotificationTopic

  # -- Processor Lambda Function Duration Alarm --
  ProcessorFunctionDurationAlarm:
    Type: "AWS::CloudWatch::Alarm"
    Condition: CreateAlarms
    Properties:
      AlarmDescription: Processor Lambda Function Duration > 240 seconds
      MetricName: Duration
      Statistic: Maximum
      ComparisonOperator: GreaterThanThreshold
      Threshold: 240000  # 240 seconds in milliseconds
      Period: 300
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref ProcessorFunction
      AlarmActions:
        - Ref: AlarmNotificationTopic

  # ===========================================================================
  # EVENTBRIDGE SCHEDULER RESOURCES
  # ===========================================================================

  # -- EventBridge Scheduler Execution Role --
  SchedulerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-${ProjectId}-${StageId}-SchedulerExecRole"
      Description: "IAM Role for EventBridge Scheduler to invoke Processor Lambda"
      Path: !Ref RolePath
      PermissionsBoundary: !If [HasPermissionsBoundaryArn, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue' ]
      AssumeRolePolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service: [scheduler.amazonaws.com]
          Action: sts:AssumeRole

      Policies:
        - PolicyName: !Sub "${Prefix}-${ProjectId}-${StageId}-SchedulerPolicy"
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SchedulerInvokeProcessor
                Effect: Allow
                Action:
                  - 'lambda:InvokeFunction'
                Resource: 
                  - !GetAtt ProcessorFunction.Arn
                  - !Sub '${ProcessorFunction.Arn}:*'

  # ===========================================================================
  # CLOUDWATCH ALARMS AND SNS NOTIFICATIONS
  # ===========================================================================

  # -- Dead Letter Queue Alarm --
  DLQMessageAlarm:
    Type: "AWS::CloudWatch::Alarm"
    Condition: CreateAlarms
    Properties:
      AlarmDescription: Messages in Dead Letter Queue > 0
      MetricName: ApproximateNumberOfMessagesVisible
      Statistic: Sum
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      Period: 300
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      Namespace: AWS/SQS
      Dimensions:
        - Name: QueueName
          Value: !GetAtt EventQueueDLQ.QueueName
      AlarmActions:
        - Ref: AlarmNotificationTopic

  # -- SNS Topic for Alarm Notifications --
  AlarmNotificationTopic:
      Type: AWS::SNS::Topic
      Condition: CreateAlarms
      Properties: 
        DisplayName: !Sub 'AWS-Alarm-${Prefix}-${ProjectId}-${StageId}'
        FifoTopic: false
        Subscription:
          - Endpoint: !Ref AlarmNotificationEmail
            Protocol: 'email'

  # ===========================================================================
  # CLOUDWATCH DASHBOARD (For PROD)
  # ===========================================================================

  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: ./template-dashboard.yml

# =============================================================================
# OUTPUTS
# -----------------------------------------------------------------------------
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/outputs-section-structure.html
#
# Place anything interesting that you would like to quickly refer to in 
# your cloudformation OUTPUT section. Test URLs, direct links to resources, etc
#

Outputs:

  # -- CloudWatch Dashboard (cf-lint will show error if we reference Dashboard resource directly)
  CloudWatchDashboard:
    Condition: CreateProdResources
    Description: "Cloud Watch Dashboard (for production environments only)"
    Value: !Sub 'https://console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${Prefix}-${ProjectId}-${StageId}-Dashboard'

  # -- Ingestor Lambda ARN
  IngestorFunctionArn:
    Description: "Ingestor Lambda ARN - Use this ARN for S3 bucket event notifications"
    Value: !GetAtt IngestorFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-IngestorFunctionArn'

  # -- Processor Lambda ARN
  ProcessorFunctionArn:
    Description: "Processor Lambda ARN"
    Value: !GetAtt ProcessorFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ProcessorFunctionArn'

  # -- SQS Queue URL
  EventQueueUrl:
    Description: "SQS Event Queue URL"
    Value: !Ref EventQueue
    Export:
      Name: !Sub '${AWS::StackName}-EventQueueUrl'

  # -- DynamoDB Table Name
  WindowTrackingTableName:
    Description: "DynamoDB Window Tracking Table Name"
    Value: !Ref WindowTrackingTable
    Export:
      Name: !Sub '${AWS::StackName}-WindowTrackingTableName'

  # -- CloudWatch Log Groups
  IngestorLogGroup:
    Description: "CloudWatch Log Group for Ingestor Lambda"
    Value: !Sub "https://console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#logStream:group=%2Faws%2Flambda%2F${Prefix}-${ProjectId}-${StageId}-Ingestor"

  ProcessorLogGroup:
    Description: "CloudWatch Log Group for Processor Lambda"
    Value: !Sub "https://console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#logStream:group=%2Faws%2Flambda%2F${Prefix}-${ProjectId}-${StageId}-Processor"

  # -- Lambda Console Links
  IngestorLambdaConsole:
    Description: "Ingestor Lambda Web Console"
    Value: !Sub "https://console.aws.amazon.com/lambda/home?region=${AWS::Region}#/functions/${IngestorFunction}?tab=code"

  ProcessorLambdaConsole:
    Description: "Processor Lambda Web Console"
    Value: !Sub "https://console.aws.amazon.com/lambda/home?region=${AWS::Region}#/functions/${ProcessorFunction}?tab=code"

  # -- SQS Console Links
  EventQueueConsole:
    Description: "SQS Event Queue Console"
    Value: !Sub "https://console.aws.amazon.com/sqs/v2/home?region=${AWS::Region}#/queues/https%3A%2F%2Fsqs.${AWS::Region}.amazonaws.com%2F${AWS::AccountId}%2F${Prefix}-${ProjectId}-${StageId}-EventQueue"

  DLQConsole:
    Description: "SQS Dead Letter Queue Console"
    Value: !Sub "https://console.aws.amazon.com/sqs/v2/home?region=${AWS::Region}#/queues/https%3A%2F%2Fsqs.${AWS::Region}.amazonaws.com%2F${AWS::AccountId}%2F${Prefix}-${ProjectId}-${StageId}-EventQueueDLQ"

  # -- DynamoDB Console Link
  WindowTrackingTableConsole:
    Description: "DynamoDB Window Tracking Table Console"
    Value: !Sub "https://console.aws.amazon.com/dynamodbv2/home?region=${AWS::Region}#table?name=${WindowTrackingTable}"